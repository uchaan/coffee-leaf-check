<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Folha de Café</title>
<!-- Fully offline: no external fonts, scripts or styles. Served by llama-server --path. -->
<style>
:root{
  --ink:#16201a;--muted:#5f6b63;--sheet:#fbfaf6;--line:#e4e2da;
  --green:#2e7d4f;--green-bg:#e4f2e8;--red:#b4432c;--red-bg:#fbe7e1;--amber:#a76300;--amber-bg:#fdf0d8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--ink);font:16px/1.45 system-ui,-apple-system,Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* camera */
#cam{position:fixed;inset:0;background:#000}
#video,#still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#still{display:none}
.shade-top{position:absolute;left:0;right:0;top:0;height:120px;background:linear-gradient(#000a,#0000)}
.shade-bot{position:absolute;left:0;right:0;bottom:0;height:200px;background:linear-gradient(#0000,#000c)}

.topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 16px 0;color:#fff}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;flex:1;min-width:0}
.chip{display:inline-flex;border:1px solid #fff6;border-radius:999px;overflow:hidden;font-size:13px;font-weight:600}
.chip button{padding:6px 10px;color:#fffb}
.chip button.on{background:#fff;color:#000}
.iconbtn{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:#0004;color:#fff}
.count{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:#f0a020;color:#000;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}

.frame{position:absolute;left:50%;top:44%;width:min(74vw,340px);aspect-ratio:3/4;transform:translate(-50%,-50%);pointer-events:none}
.frame i{position:absolute;width:38px;height:38px;border:4px solid #fff;border-radius:6px}
.frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
.frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
.frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
.scan{position:absolute;left:4%;right:4%;height:3px;border-radius:2px;background:#7CFFA8;box-shadow:0 0 16px #7CFFA8;top:0;display:none}
.busy .scan{display:block;animation:scan 1.4s ease-in-out infinite alternate}
@keyframes scan{to{top:calc(100% - 3px)}}
.hint{position:absolute;left:16px;right:16px;bottom:calc(150px + env(safe-area-inset-bottom));text-align:center;color:#fff;font-size:15px;text-shadow:0 1px 4px #000}

.controls{position:absolute;left:0;right:0;bottom:0;padding:0 28px calc(28px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between}
.shutter{width:78px;height:78px;border-radius:50%;border:5px solid #fff;display:grid;place-items:center}
.shutter::after{content:"";width:60px;height:60px;border-radius:50%;background:#fff;transition:transform .1s}
.shutter:active::after{transform:scale(.88)}
.side{width:52px;height:52px;border-radius:14px;background:#fff2;display:grid;place-items:center;color:#fff}
.busy .controls,.busy .hint{opacity:.35;pointer-events:none}
#camerr{position:absolute;left:24px;right:24px;top:40%;color:#fff;text-align:center;display:none}

/* result sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:78vh;overflow-y:auto;background:var(--sheet);border-radius:22px 22px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px #0006}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-ok{color:var(--green);background:var(--green-bg)}
.s-bad{color:var(--red);background:var(--red-bg)}
.s-unsure{color:var(--amber);background:var(--amber-bg)}
.title{display:flex;align-items:center;gap:12px;margin:10px 0 2px}
.title h2{flex:1;margin:0;font-size:26px;line-height:1.15}
.speak{flex:none;width:48px;height:48px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center}
.speak.playing{background:var(--green)}
.looks{color:var(--muted);margin:2px 0 0}
.en-name{margin:0;font-size:14px;color:var(--muted);font-style:italic}
.conf{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--muted)}
.conf .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.conf .bar i{display:block;height:100%;background:currentColor}
.block{margin-top:16px;padding:14px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.block h3{margin:0 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.block p{margin:0}
.src{font-size:12px;color:var(--muted);margin:14px 0 0}
.saved{margin-top:12px;font-size:14px;color:var(--amber)}
.cta{display:block;width:100%;margin-top:18px;padding:16px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;font-size:17px;text-align:center}
.meta{font-size:11px;color:#9aa19c;margin-top:10px;text-align:center}

/* queue / about sheet content */
.panel h2{margin:0 0 4px;font-size:22px}
.q{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.q img{width:64px;height:64px;object-fit:cover;border-radius:10px;flex:none}
.panel p{margin:8px 0}
.small{font-size:13px;color:var(--muted)}
#err{position:fixed;left:16px;right:16px;top:80px;background:#b4432c;color:#fff;border-radius:12px;padding:12px;font-size:14px;display:none;white-space:pre-wrap}
</style>
</head>
<body>

<div id="cam">
  <video id="video" playsinline muted autoplay></video>
  <img id="still" alt="">
  <div class="shade-top"></div><div class="shade-bot"></div>

  <div class="topbar">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6C16 14 10 30 14 46c2 8 10 12 18 12s16-4 18-12C54 30 48 14 32 6z" fill="#8fd19e"/><path d="M32 12v44M32 26l-9-7M32 36l11-8M32 46l-10-7" stroke="#1b4d2b" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>
      <span data-t="appName"></span>
    </div>
    <div class="chip" id="langchip"></div>
    <button class="iconbtn" id="btn-queue" aria-label="queue">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      <span class="count" id="qcount" hidden></span>
    </button>
  </div>

  <div class="frame" id="frame"><i></i><i></i><i></i><i></i><div class="scan"></div></div>
  <div class="hint" id="hint"></div>
  <div id="camerr"></div>

  <div class="controls">
    <label class="side" aria-label="gallery">
      <input id="file" type="file" accept="image/*" hidden>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg>
    </label>
    <button class="shutter" id="shutter" aria-label="check leaf"></button>
    <button class="side" id="btn-about" aria-label="about">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
    </button>
  </div>
</div>

<div class="sheet" id="sheet"><div class="grab"></div><div id="sheet-body"></div></div>
<div id="err"></div>
<audio id="voice" preload="none"></audio>

<script src="app.js"></script>
</body>
</html>
